[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playstore-scraper"
version = "0.1.0"
description = "Google Play Store reviews scraper — raw JSON export"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
playstore-scraper = "playstore_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/playstore_scraper"]

[tool.hatch.build.targets.sdist]
include = ["src/playstore_scraper", "README.md", "PLAN.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits the live Google Play Store (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
